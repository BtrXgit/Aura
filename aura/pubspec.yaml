    - assets/focusIcons/asmr/
    - assets/focusIcons/music/
    - assets/focusIcons/nature/
    - assets/focusIcons/productivity/
    - assets/focusIcons/rain/
    - assets/music/
    - assets/nature/
    - assets/rain/
    - assets/transport/
    - assets/icons/nature/
    - assets/icons/music/
    - assets/icons/animals/
    - assets/icons/rain/
    - assets/icons/asmr/
    - assets/icons/transport/
    - assets/
    - assets/fonts/
    - assets/appicons/
    - assets/noise/
    - assets/splash/
    - assets/meditate/
  fonts:
    - family: broken
      fonts:
        - asset: assets/fonts/broken.ttf

